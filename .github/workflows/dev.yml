name: Build CLI Binaries for Development

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            platform: linux
            target: linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
            target: linux-arm64
          - os: macos-13
            arch: x64
            platform: darwin
            target: macos-x64
          - os: macos-14
            arch: arm64
            platform: darwin
            target: macos-arm64
          - os: windows-latest
            arch: x64
            platform: win32
            target: windows-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # 根据你的应用要求调整
      
      - run: npm ci
      
      # 构建单体二进制（以 nexe 为例）
      # 注意：Windows 上 nexe 的 --target 可能需要调整为 windows-x64
      - name: Build Binary with nexe
        run: |
          npx nexe main.js --target ${{ matrix.target }} -o my-app-${{ matrix.platform }}-${{ matrix.arch }}
        shell: bash # 在 Windows 上也使用 bash 以确保命令一致

      # 重命名 Windows 产物为 .exe（nexe 可能已自动处理，视版本而定）
      - name: Rename for Windows
        if: matrix.platform == 'win32'
        run: mv my-app-win32-x64 my-app-win32-x64.exe
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: my-app-${{ matrix.platform }}-${{ matrix.arch }}
          path: my-app-${{ matrix.platform }}-${{ matrix.arch }}*